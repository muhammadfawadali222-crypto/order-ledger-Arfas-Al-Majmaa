<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-main: #0b0d14;
      --bg-card: #141724;
      --bg-card-hover: #1b1f30;
      --bg-glass: rgba(20, 23, 36, 0.75);
      
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.4);
      --accent-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      
      --shadow-3d: 0 20px 40px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.1) inset;
      --shadow-card: 0 10px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
      --button-3d-shadow: 0 6px 0 #4c1d95, 0 10px 15px rgba(0,0,0,0.4);
    }

    /* Color Theme Presets */
    body[data-theme="violet"] {
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #d946ef);
      --button-3d-shadow: 0 6px 0 #5b21b6, 0 10px 15px rgba(0,0,0,0.4);
    }
    body[data-theme="emerald"] {
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-gradient: linear-gradient(135deg, #10b981, #06b6d4);
      --button-3d-shadow: 0 6px 0 #047857, 0 10px 15px rgba(0,0,0,0.4);
    }
    body[data-theme="cyan"] {
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.4);
      --accent-gradient: linear-gradient(135deg, #06b6d4, #3b82f6);
      --button-3d-shadow: 0 6px 0 #0e7490, 0 10px 15px rgba(0,0,0,0.4);
    }
    body[data-theme="gold"] {
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --accent-gradient: linear-gradient(135deg, #f59e0b, #ef4444);
      --button-3d-shadow: 0 6px 0 #b45309, 0 10px 15px rgba(0,0,0,0.4);
    }
    body[data-theme="crimson"] {
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --accent-gradient: linear-gradient(135deg, #ef4444, #ec4899);
      --button-3d-shadow: 0 6px 0 #b91c1c, 0 10px 15px rgba(0,0,0,0.4);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 15% 15%, var(--accent-glow) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    #app {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }

    /* ---------- 3D Header ---------- */
    header.app-header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 22px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-3d);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    header.app-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent-gradient);
    }
    .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: var(--accent-gradient);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; flex-shrink: 0;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .brand-logo-img { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; flex-shrink: 0; }
    .company-name { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
    .project-name { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .header-row { display: flex; justify-content: space-between; align-items: flex-end; }
    .app-title { font-size: 26px; font-weight: 800; margin: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-meta { text-align: right; background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 16px; }
    .header-meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .header-meta-value { font-size: 16px; color: var(--accent); font-weight: 700; }
    .settings-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); border-radius: 12px;
      width: 40px; height: 40px; font-size: 18px; color: var(--text-main); cursor: pointer; flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .settings-btn:hover { background: rgba(255,255,255,0.12); transform: rotate(45deg); }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .sync-dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .sync-dot.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    .sync-status { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; }

    /* ---------- 3D Tabs ---------- */
    nav.tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 12px 22px; font-size: 14px; color: var(--text-muted);
      cursor: pointer; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow-card); transition: all 0.2s ease;
    }
    .tab-btn:hover { color: var(--text-main); background: var(--bg-card-hover); }
    .tab-btn.active {
      color: #fff; background: var(--accent-gradient); border-color: transparent;
      box-shadow: 0 10px 20px var(--accent-glow); transform: translateY(-2px);
    }

    /* ---------- Month bar ---------- */
    .month-bar { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .month-arrow {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
      width: 38px; height: 38px; font-size: 18px; color: var(--accent); cursor: pointer;
      box-shadow: var(--shadow-card); font-weight: 700; transition: all 0.2s;
    }
    .month-arrow:hover { background: var(--bg-card-hover); transform: scale(1.05); }
    .month-label { font-size: 20px; min-width: 180px; text-align: center; color: var(--text-main); font-weight: 700; }

    /* ---------- 3D Table styling ---------- */
    .table-wrap {
      border: 1px solid var(--border-color); border-radius: 18px; overflow: hidden;
      background: var(--bg-card); box-shadow: var(--shadow-3d); overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      padding: 14px 16px; font-size: 12px; color: var(--text-muted); font-weight: 700;
      border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.02); text-align: left;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.row-active { background: rgba(124, 58, 237, 0.08); }
    .item-name { font-size: 14px; font-weight: 600; color: var(--text-main); }
    .item-id { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .qty-input {
      width: 70px; padding: 8px 10px; border: 1.5px solid var(--border-color); border-radius: 10px;
      text-align: center; font-size: 14px; color: #fff; font-weight: 700; background: rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .qty-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    /* ---------- Summary Bar ---------- */
    .summary-bar {
      display: flex; justify-content: space-between; align-items: center; margin-top: 20px;
      padding: 20px 24px; background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 18px; color: #fff; box-shadow: var(--shadow-3d); position: relative; overflow: hidden;
    }
    .summary-bar::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--accent-gradient);
    }
    .summary-lines { font-size: 14px; color: var(--text-muted); font-weight: 600; }
    .summary-right { display: flex; align-items: baseline; gap: 12px; }
    .summary-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
    .summary-value { font-size: 26px; font-weight: 800; color: var(--accent); }

    /* ---------- 3D Buttons ---------- */
    .btn-primary {
      background: var(--accent-gradient); color: #fff; border: none;
      border-radius: 12px; padding: 12px 22px; font-size: 14px; cursor: pointer; font-weight: 700;
      box-shadow: 0 8px 20px var(--accent-glow); transition: all 0.2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px var(--accent-glow); }
    .btn-secondary {
      background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 10px 18px; font-size: 14px; cursor: pointer; font-weight: 600; transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .btn-link { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-weight: 600; padding: 0; }
    .btn-link.danger { color: var(--danger); }

    /* ---------- Converter Row ---------- */
    .convert-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); border-radius: 8px;
      width: 32px; height: 32px; font-size: 14px; color: var(--text-main); cursor: pointer; transition: all 0.2s;
    }
    .convert-btn:hover { background: var(--accent); color: #fff; }
    .convert-row { background: rgba(0,0,0,0.3); }
    .convert-input { width: 90px; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 8px; background: #000; color: #fff; text-align: center; }
    .convert-result { font-weight: 700; color: var(--accent); margin: 0 8px; }
    .convert-pack-info { font-size: 12px; color: var(--text-muted); margin-right: 12px; }
    .convert-use-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }

    /* ---------- History Grid ---------- */
    .history-grid { display: grid; grid-template-columns: 240px 1fr; gap: 20px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      display: flex; justify-content: space-between; padding: 12px 16px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; color: var(--text-main);
      cursor: pointer; box-shadow: var(--shadow-card); transition: all 0.2s;
    }
    .history-item:hover { background: var(--bg-card-hover); }
    .history-item.active { background: var(--accent-gradient); border-color: transparent; color: #fff; font-weight: 700; }
    @media (max-width: 640px) { .history-grid { grid-template-columns: 1fr; } }

    /* ---------- Bills Dropzone ---------- */
    .drop-zone {
      display: block; border: 2px dashed var(--border-color); border-radius: 18px; padding: 30px 20px;
      text-align: center; cursor: pointer; background: var(--bg-card); transition: all 0.2s; margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.active { border-color: var(--accent); background: rgba(124, 58, 237, 0.05); }
    .drop-zone-icon { font-size: 32px; color: var(--accent); margin-bottom: 8px; }
    .drop-zone-text { font-size: 15px; color: var(--text-main); font-weight: 600; }
    .drop-zone-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .bills-list { display: flex; flex-direction: column; gap: 10px; }
    .bill-row {
      display: flex; align-items: center; gap: 14px; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-card);
    }
    .bill-icon {
      width: 40px; height: 40px; border-radius: 10px; background: var(--accent-gradient);
      color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .bill-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
    .bill-meta { font-size: 12px; color: var(--text-muted); }

    /* ---------- Catalogue & Inputs ---------- */
    .catalogue-bar { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
    .search-input {
      flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px;
      background: var(--bg-card); color: #fff; font-size: 14px;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    /* ---------- Modals ---------- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
      padding: 28px; width: 100%; max-width: 420px; box-shadow: var(--shadow-3d); max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 20px; margin: 0 0 18px; color: var(--text-main); }
    .field-label { display: block; font-size: 12px; color: var(--text-muted); margin: 12px 0 6px; font-weight: 600; text-transform: uppercase; }
    .field-input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 10px;
      background: rgba(0,0,0,0.4); color: #fff; font-size: 14px;
    }
    .field-input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; align-items: center; }
    .two-col { display: flex; gap: 12px; }
    .two-col > div { flex: 1; }

    /* ---------- Theme Palette Picker ---------- */
    .theme-picker-row { display: flex; gap: 10px; margin-top: 8px; }
    .theme-circle {
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s;
    }
    .theme-circle:hover, .theme-circle.active { transform: scale(1.15); border-color: #fff; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--accent); color: #fff; padding: 12px 24px;
      border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 200; font-weight: 600;
    }

    footer.app-footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-muted); letter-spacing: 0.5px; }
  </style>
</head>

      { id: "PRD-0016844", name: "Baby Food Dispensing Spoon Feeder", uom: "Piece", price: 50 },
      { id: "PRD-0016847", name: "Sunst Cafe Powder Blue Perfume", uom: "Piece", price: 65 },
      { id: "PRD-0016848", name: "Capriccio Perfume", uom: "Piece", price: 65 },
      { id: "PRD-0016913", name: "Nivea Men Shaving Foam 200ml (1x12Pcs)", uom: "Carton", price: 250 },
      { id: "PRD-0016914", name: "Cetaphil Gentle Cleansing Bar 127gm (1x12Pcs)", uom: "Dozen", price: 260 },
      { id: "PRD-0016915", name: "Estremo White Petroleum Gel 1000gm (1x12Pcs)", uom: "Dozen", price: 340 },
      { id: "PRD-0000012", name: "Trash Bag - Black (55 Gallon)", uom: "Bag", price: 67 },
    ];

    function fmt(n) {
      if (n === null || n === undefined || isNaN(n)) return "0";
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }
    function defaultPackSize(uom) { return String(uom).toLowerCase() === "dozen" ? 12 : 1; }
    function withPackSize(p) { return { ...p, packSize: p.packSize && p.packSize > 0 ? p.packSize : defaultPackSize(p.uom) }; }
    function currentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    function monthLabel(key) {
      const [y, m] = key.split("-").map(Number);
      return `${MONTH_NAMES[m - 1]} ${y}`;
    }
    function shiftMonthKey(key, delta) {
      const [y, m] = key.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const state = {
      products: [],
      orders: {},
      bills: [],
      branding: { logo: null, theme: "violet" },
      tab: "order",
      activeMonth: currentMonthKey(),
      historyMonth: null,
      billsMonth: currentMonthKey(),
      convertRow: null,
      ready: false,
    };

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    const CONFIG_DOC = () => doc(db, "config", "app");

    function startLiveSync() {
      onSnapshot(collection(db, "products"), (snap) => {
        if (snap.empty && state.products.length === 0) {
          seedProducts();
          return;
        }
        state.products = snap.docs.map((d) => withPackSize({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
        state.ready = true;
        render();
      });

      onSnapshot(collection(db, "orders"), (snap) => {
        const next = {};
        snap.docs.forEach((d) => { next[d.id] = d.data(); });
        state.orders = next;
        render();
      });

      onSnapshot(collection(db, "bills"), (snap) => {
        state.bills = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
        render();
      });

      onSnapshot(CONFIG_DOC(), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          state.branding = { logo: data.logo || null, theme: data.theme || "violet" };
          document.body.setAttribute("data-theme", state.branding.theme);
          render();
        }
      });

      window.addEventListener("online", updateSyncStatus);
      window.addEventListener("offline", updateSyncStatus);
      updateSyncStatus();
    }

    async function seedProducts() {
      for (const p of SEED_PRODUCTS) {
        await setDoc(doc(db, "products", p.id), withPackSize(p));
      }
    }

    function updateSyncStatus() {
      const dot = document.getElementById("sync-dot");
      const label = document.getElementById("sync-label");
      if (!dot) return;
      if (navigator.onLine) {
        dot.className = "sync-dot online";
        label.textContent = "Synced — Live connection active";
      } else {
        dot.className = "sync-dot offline";
        label.textContent = "Offline — Changes saved locally";
      }
    }

    async function setQty(productId, value) {
      const n = value === "" ? "" : Math.max(0, Number(value));
      const monthKey = state.activeMonth;
      const existing = state.orders[monthKey]?.qty || {};
      const qty = { ...existing, [productId]: n };
      await setDoc(doc(db, "orders", monthKey), { qty, savedAt: Date.now() }, { merge: true });
    }

    async function saveProduct(draft) {
      const clean = {
        name: draft.name,
        uom: draft.uom,
        price: Number(draft.price),
        packSize: draft.packSize && Number(draft.packSize) > 0 ? Number(draft.packSize) : defaultPackSize(draft.uom),
      };
      await setDoc(doc(db, "products", draft.id), clean);
      showToast("Item saved successfully");
    }

    async function deleteProductById(id) {
      await deleteDoc(doc(db, "products", id));
      showToast("Item deleted");
    }

    async function clearMonth(monthKey) {
      await deleteDoc(doc(db, "orders", monthKey));
      showToast(`${monthLabel(monthKey)} orders cleared`);
    }

    async function uploadBills(fileList, monthKey) {
      const files = Array.from(fileList || []);
      let saved = 0, tooLarge = false;
      for (const file of files) {
        if (file.type !== "application/pdf") continue;
        if (file.size > MAX_BILL_BYTES) { tooLarge = true; continue; }
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
        const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        try {
          await setDoc(doc(db, "bills", id), {
            name: file.name, size: file.size, monthKey, dataUrl, savedAt: Date.now(),
          });
          saved++;
        } catch (e) {
          tooLarge = true;
        }
      }
      if (saved > 0) showToast(`${saved} bill(s) uploaded`);
      if (tooLarge) showToast("Some files were skipped (>700KB max size)");
    }

    async function deleteBill(bill) {
      await deleteDoc(doc(db, "bills", bill.id));
      showToast("Bill deleted");
    }

    function downloadBill(bill) {
      if (!bill.dataUrl) { showToast("File not found"); return; }
      const a = document.createElement("a");
      a.href = bill.dataUrl;
      a.download = bill.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function saveBranding(next) {
      await setDoc(CONFIG_DOC(), next, { merge: true });
    }

    function render() {
      if (!state.ready) return;
      renderHeader();
      renderTabs();
      const main = document.getElementById("main");
      if (state.tab === "order") main.innerHTML = renderOrderTab();
      else if (state.tab === "history") main.innerHTML = renderHistoryTab();
      else if (state.tab === "bills") main.innerHTML = renderBillsTab();
      else if (state.tab === "catalogue") main.innerHTML = renderCatalogueTab();
      attachTabEvents();
    }

    function renderHeader() {
      const logoWrap = document.getElementById("logo-wrap");
      logoWrap.innerHTML = state.branding.logo
        ? `<img src="${state.branding.logo}" class="brand-logo-img" alt="Logo">`
        : `<div class="brand-mark">AT</div>`;
      document.getElementById("catalogue-count").textContent = `${state.products.length} items`;
    }

    function renderTabs() {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === state.tab);
      });
    }

    function renderOrderTab() {
      const qty = state.orders[state.activeMonth]?.qty || {};
      let grandTotal = 0, lineCount = 0;
      const rows = state.products.map((p) => {
        const q = qty[p.id];
        const qNum = Number(q) || 0;
        const lineTotal = qNum * Number(p.price || 0);
        if (qNum > 0) { grandTotal += lineTotal; lineCount++; }
        const isConverting = state.convertRow === p.id;
        return `
          <tr class="${qNum > 0 ? "row-active" : ""}">
            <td><div class="item-name">${escapeHtml(p.name)}</div><div class="item-id">${escapeHtml(p.id)}</div></td>
            <td>${escapeHtml(p.uom)}</td>
            <td style="text-align:right">${fmt(p.price)}</td>
            <td style="text-align:center">
              <input type="number" min="0" class="qty-input" data-qty="${p.id}" value="${q === undefined ? "" : q}" placeholder="0">
            </td>
            <td style="text-align:right;font-weight:${qNum > 0 ? 700 : 400}">${lineTotal > 0 ? fmt(lineTotal) : "—"}</td>
            <td style="text-align:center"><button class="convert-btn" data-convert="${p.id}">⇄</button></td>
          </tr>
          ${isConverting ? `
          <tr class="convert-row">
            <td colspan="6">
              <span style="font-size:12.5px;color:var(--accent);font-weight:600;margin-right:8px;">Pieces Required:</span>
              <input type="number" min="0" class="convert-input" id="convert-pieces" placeholder="e.g. 100">
              <span style="margin: 0 8px;">=</span>
              <span class="convert-result" id="convert-result">—</span>
              <span class="convert-pack-info">(1 ${escapeHtml(p.uom)} = ${p.packSize} pcs)</span>
              <button class="convert-use-btn" data-use="${p.id}" data-pack="${p.packSize}">Apply Qty</button>
            </td>
          </tr>` : ""}
        `;
      }).join("");

      return `
        <div class="month-bar">
          <button class="month-arrow" data-shift="-1">‹</button>
          <div class="month-label">${monthLabel(state.activeMonth)}</div>
          <button class="month-arrow" data-shift="1">›</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>UOM</th><th style="text-align:right">Price</th><th style="text-align:center">Qty</th><th style="text-align:right">Total</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="summary-bar">
          <div class="summary-lines">${lineCount} item line${lineCount === 1 ? "" : "s"}</div>
          <div class="summary-right"><span class="summary-label">Grand Total</span><span class="summary-value">${fmt(grandTotal)}</span></div>
        </div>
      `;
    }

    function totalForMonth(key) {
      const qty = state.orders[key]?.qty || {};
      return state.products.reduce((sum, p) => sum + (Number(qty[p.id]) || 0) * Number(p.price || 0), 0);
    }

    function renderHistoryTab() {
      const monthKeys = Object.keys(state.orders).sort().reverse();
      if (monthKeys.length === 0) {
        return `<div class="empty" style="text-align:center;padding:50px;"><div style="font-size:18px;font-weight:700;">No Saved Orders Yet</div><div style="color:var(--text-muted);margin-top:6px;">Start filling items in "New Order" tab.</div></div>`;
      }
      const openKey = state.historyMonth && monthKeys.includes(state.historyMonth) ? state.historyMonth : monthKeys[0];
      const openQty = state.orders[openKey]?.qty || {};
      const lines = state.products.map((p) => ({ ...p, qty: Number(openQty[p.id]) || 0 })).filter((l) => l.qty > 0);

      const listHtml = monthKeys.map((k) => `
        <button class="history-item ${k === openKey ? "active" : ""}" data-history="${k}">
          <span>${monthLabel(k)}</span><span>${fmt(totalForMonth(k))}</span>
        </button>
      `).join("");

      const linesHtml = lines.length === 0
        ? `<div style="color:var(--text-muted);text-align:center;padding:20px;">No quantity entered for this month.</div>`
        : `<div class="table-wrap">
            <table>
              <thead><tr><th>Item</th><th style="text-align:center">Qty</th><th style="text-align:right">Total</th></tr></thead>
              <tbody>${lines.map((l) => `<tr><td>${escapeHtml(l.name)}</td><td style="text-align:center">${l.qty}</td><td style="text-align:right">${fmt(l.qty * l.price)}</td></tr>`).join("")}</tbody>
            </table>
          </div>`;

      return `
        <div class="history-grid">
          <div class="history-list">${listHtml}</div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <h2 style="font-size:20px;margin:0;color:var(--text-main);">${monthLabel(openKey)}</h2>
              <div style="display:flex;gap:14px;">
                <button class="btn-link" data-open-month="${openKey}">Edit Order</button>
                <button class="btn-link danger" data-clear-month="${openKey}">Clear</button>
              </div>
            </div>
            ${linesHtml}
            <div class="summary-bar" style="margin-top:16px;">
              <div></div>
              <div class="summary-right"><span class="summary-label">Grand Total</span><span class="summary-value">${fmt(totalForMonth(openKey))}</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBillsTab() {
      const monthBills = state.bills.filter((b) => b.monthKey === state.billsMonth);
      const listHtml = monthBills.length === 0
        ? `<div style="text-align:center;padding:40px;color:var(--text-muted);">No bills uploaded for ${monthLabel(state.billsMonth)}.</div>`
        : `<div class="bills-list">${monthBills.map((b) => `
            <div class="bill-row">
              <div class="bill-icon">PDF</div>
              <div style="flex:1;min-width:0;">
                <div class="bill-name">${escapeHtml(b.name)}</div>
                <div class="bill-meta">${(b.size / 1024 / 1024).toFixed(2)} MB</div>
              </div>
              <button class="btn-link" data-dl="${b.id}">Download</button>
              <button class="btn-link danger" data-del="${b.id}">Delete</button>
            </div>`).join("")}
        </div>`;

      return `
        <div class="month-bar">
          <button class="month-arrow" data-bill-shift="-1">‹</button>
          <div class="month-label">${monthLabel(state.billsMonth)}</div>
          <button class="month-arrow" data-bill-shift="1">›</button>
        </div>
        <label class="drop-zone" id="drop-zone">
          <div class="drop-zone-icon">📄</div>
          <div class="drop-zone-text">Tap to upload or drag & drop PDF bills</div>
          <div class="drop-zone-hint">Max size 700KB per file</div>
          <input type="file" multiple accept="application/pdf" id="bill-upload" style="display:none">
        </label>
        ${listHtml}
      `;
    }

    function renderCatalogueTab() {
      const rows = state.products.map(p => `
        <tr>
          <td><div class="item-name">${escapeHtml(p.name)}</div><div class="item-id">${escapeHtml(p.id)}</div></td>
          <td>${escapeHtml(p.uom)}</td>
          <td style="text-align:right">${fmt(p.price)}</td>
          <td style="text-align:center">
            <button class="btn-link" data-edit-prd="${p.id}">Edit</button>
          </td>
        </tr>
      `).join("");
      return `
        <div class="catalogue-bar">
          <input type="text" class="search-input" id="cat-search" placeholder="Search catalogue items...">
          <button class="btn-primary" id="btn-add-prd">+ Add Item</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>UOM</th><th style="text-align:right">Price</th><th style="text-align:center">Action</th></tr></thead>
            <tbody id="cat-tbody">${rows}</tbody>
          </table>
        </div>
      `;
    }

    function attachTabEvents() {
      document.querySelectorAll(".tab-btn").forEach(b => {
        b.onclick = () => { state.tab = b.dataset.tab; render(); };
      });

      document.querySelectorAll("[data-shift]").forEach(b => {
        b.onclick = () => { state.activeMonth = shiftMonthKey(state.activeMonth, Number(b.dataset.shift)); render(); };
      });

      document.querySelectorAll(".qty-input").forEach(i => {
        i.onchange = (e) => setQty(e.target.dataset.qty, e.target.value);
      });

      document.querySelectorAll(".convert-btn").forEach(b => {
        b.onclick = () => { state.convertRow = state.convertRow === b.dataset.convert ? null : b.dataset.convert; render(); };
      });

      const ci = document.getElementById("convert-pieces");
      if (ci) {
        ci.oninput = (e) => {
          const p = state.products.find(x => x.id === state.convertRow);
          const res = document.getElementById("convert-result");
          if (!p || !res) return;
          const v = Number(e.target.value) || 0;
          res.textContent = v > 0 ? (v / p.packSize).toFixed(2) + " " + p.uom : "—";
        };
      }

      document.querySelectorAll(".convert-use-btn").forEach(b => {
        b.onclick = () => {
          const v = Number(document.getElementById("convert-pieces")?.value) || 0;
          const pk = Number(b.dataset.pack) || 1;
          setQty(b.dataset.use, Math.ceil(v / pk));
          state.convertRow = null;
          render();
        };
      });

      document.querySelectorAll("[data-history]").forEach(b => {
        b.onclick = () => { state.historyMonth = b.dataset.history; render(); };
      });
      document.querySelectorAll("[data-open-month]").forEach(b => {
        b.onclick = () => { state.activeMonth = b.dataset.openMonth; state.tab = "order"; render(); };
      });
      document.querySelectorAll("[data-clear-month]").forEach(b => {
        b.onclick = () => { if(confirm("Clear this month's order data?")) clearMonth(b.dataset.clearMonth); };
      });

      document.querySelectorAll("[data-bill-shift]").forEach(b => {
        b.onclick = () => { state.billsMonth = shiftMonthKey(state.billsMonth, Number(b.dataset.billShift)); render(); };
      });

      const dropZone = document.getElementById("drop-zone");
      const up = document.getElementById("bill-upload");
      if (dropZone) {
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add("active"); };
        dropZone.ondragleave = () => dropZone.classList.remove("active");
        dropZone.ondrop = (e) => {
          e.preventDefault();
          dropZone.classList.remove("active");
          if (e.dataTransfer.files.length) uploadBills(e.dataTransfer.files, state.billsMonth);
        };
      }
      if (up) up.onchange = (e) => uploadBills(e.target.files, state.billsMonth);

      document.querySelectorAll("[data-dl]").forEach(b => {
        b.onclick = () => { const bill = state.bills.find(x => x.id === b.dataset.dl); if(bill) downloadBill(bill); };
      });
      document.querySelectorAll("[data-del]").forEach(b => {
        b.onclick = () => { const bill = state.bills.find(x => x.id === b.dataset.del); if(bill && confirm("Delete this bill?")) deleteBill(bill); };
      });

      const addPrd = document.getElementById("btn-add-prd");
      if (addPrd) addPrd.onclick = () => openMod();
      document.querySelectorAll("[data-edit-prd]").forEach(b => {
        b.onclick = () => openMod(state.products.find(x => x.id === b.dataset.editPrd));
      });
      const cs = document.getElementById("cat-search");
      if (cs) {
        cs.oninput = (e) => {
          const q = e.target.value.toLowerCase();
          document.querySelectorAll("#cat-tbody tr").forEach(tr => {
            tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
          });
        };
      }
    }

    function openMod(p = null) {
      const root = document.getElementById("modal-root");
      const isNew = !p;
      const id = p?.id || `PRD-${Date.now().toString().slice(-7)}`;
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal">
            <h3>${isNew ? "Add New Item" : "Edit Item"}</h3>
            <label class="field-label">Item ID</label>
            <input type="text" class="field-input" id="pm-id" value="${id}" disabled>
            <label class="field-label">Item Name</label>
            <input type="text" class="field-input" id="pm-name" value="${p?.name || ""}">
            <div class="two-col">
              <div><label class="field-label">UOM</label><input type="text" class="field-input" id="pm-uom" value="${p?.uom || ""}"></div>
              <div><label class="field-label">Price</label><input type="number" step="0.01" class="field-input" id="pm-price" value="${p?.price || ""}"></div>
            </div>
            <label class="field-label">Pack Size (Pieces in 1 UOM)</label>
            <input type="number" class="field-input" id="pm-pack" value="${p?.packSize || ""}">
            <div class="modal-actions">
              <button class="btn-primary" id="pm-save">Save Item</button>
              <button class="btn-secondary" id="pm-close">Cancel</button>
              ${!isNew ? `<button class="btn-link danger" style="margin-left:auto" id="pm-del">Delete</button>` : ""}
            </div>
          </div>
        </div>
      `;
      document.getElementById("pm-close").onclick = () => root.innerHTML = "";
      document.getElementById("pm-save").onclick = () => {
        saveProduct({
          id: document.getElementById("pm-id").value,
          name: document.getElementById("pm-name").value,
          uom: document.getElementById("pm-uom").value,
          price: document.getElementById("pm-price").value,
          packSize: document.getElementById("pm-pack").value
        });
        root.innerHTML = "";
      };
      if (!isNew) {
        document.getElementById("pm-del").onclick = () => {
          if (confirm("Delete this item?")) { deleteProductById(id); root.innerHTML = ""; }
        };
      }
    }

    document.getElementById("settings-btn").onclick = () => {
      const root = document.getElementById("modal-root");
      root.innerHTML = `
        <div class="modal-overlay">
          <div class="modal">
            <h3>Settings & Theme</h3>
            <label class="field-label">Select Accent Theme Color</label>
            <div class="theme-picker-row">
              <div class="theme-circle ${state.branding.theme === 'violet' ? 'active' : ''}" style="background:#8b5cf6;" data-th="violet"></div>
              <div class="theme-circle ${state.branding.theme === 'emerald' ? 'active' : ''}" style="background:#10b981;" data-th="emerald"></div>
              <div class="theme-circle ${state.branding.theme === 'cyan' ? 'active' : ''}" style="background:#06b6d4;" data-th="cyan"></div>
              <div class="theme-circle ${state.branding.theme === 'gold' ? 'active' : ''}" style="background:#f59e0b;" data-th="gold"></div>
              <div class="theme-circle ${state.branding.theme === 'crimson' ? 'active' : ''}" style="background:#ef4444;" data-th="crimson"></div>
            </div>
            <label class="field-label" style="margin-top:18px;">Custom Logo URL</label>
            <input type="text" class="field-input" id="sm-logo" value="${state.branding.logo || ""}" placeholder="https://...">
            <div class="modal-actions">
              <button class="btn-primary" id="sm-save">Save Settings</button>
              <button class="btn-secondary" id="sm-close">Close</button>
            </div>
          </div>
        </div>
      `;

      let selectedTheme = state.branding.theme || "violet";
      document.querySelectorAll(".theme-circle").forEach(el => {
        el.onclick = () => {
          document.querySelectorAll(".theme-circle").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          selectedTheme = el.dataset.th;
        };
      });

      document.getElementById("sm-close").onclick = () => root.innerHTML = "";
      document.getElementById("sm-save").onclick = () => {
        saveBranding({ theme: selectedTheme, logo: document.getElementById("sm-logo").value });
        root.innerHTML = "";
      };
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        startLiveSync();
      } else {
        signInAnonymously(auth).catch(err => showToast("Auth failed: " + err.message));
      }
    });
  </script>
</body>
</html>

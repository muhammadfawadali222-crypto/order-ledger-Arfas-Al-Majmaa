<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Afras Order Ledger</title>
  <meta name="theme-color" content="#3E2C8C">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PIN gate -->
  <div class="pin-gate" id="pin-gate">
    <div class="pin-card">
      <div class="brand-mark">AT</div>
      <h2 id="pin-title">PIN daalein</h2>
      <p id="pin-sub">Afras Order Ledger</p>
      <input type="password" inputmode="numeric" class="pin-input" id="pin-input" maxlength="8" placeholder="••••">
      <input type="password" inputmode="numeric" class="pin-input" id="pin-confirm" maxlength="8" placeholder="PIN dobara likhein" style="display:none;">
      <div class="pin-error" id="pin-error"></div>
      <button class="btn-primary" id="pin-submit" style="width:100%;">Enter</button>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" style="display:none;">
    <div id="app-inner">
      <header class="app-header">
        <div class="header-top">
          <div id="logo-wrap"><div class="brand-mark">AT</div></div>
          <div style="flex:1;">
            <div class="company-name">Afras Trading &amp; Co.</div>
            <div class="project-name">Al Majmaa Project</div>
          </div>
          <button class="settings-btn" id="settings-btn" title="Logo aur background badlein">⚙</button>
        </div>
        <div class="header-row">
          <h1 class="app-title">Order Ledger</h1>
          <div class="header-meta">
            <div class="header-meta-label">Catalogue</div>
            <div class="header-meta-value" id="catalogue-count">0 items</div>
          </div>
        </div>
        <div class="sync-status"><span class="sync-dot online" id="sync-dot"></span><span id="sync-label">Connecting…</span></div>
      </header>

      <nav class="tabs">
        <button class="tab-btn" data-tab="order">New Order</button>
        <button class="tab-btn" data-tab="history">History</button>
        <button class="tab-btn" data-tab="bills">Bills</button>
        <button class="tab-btn" data-tab="catalogue">Catalogue</button>
      </nav>

      <main id="main"></main>

      <footer class="app-footer">Created by Muhammad Fawad Ali</footer>
    </div>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast" style="display:none;"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
